<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Free Laser Cut File</title>
<meta name="description" content="Download the free laser cut file, and see more designs.">
<link rel="icon" href="images/logo.png">
<style>
  /* Colors sampled from the Etsy shop page. */
  :root {
    --bg: #faf8f5; --text: #222; --muted: #595959;
    --pine: #14190c; --accent: #7a1418; --accent-text: #fff; --etsy: #f1641e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  img { display: block; width: 100%; height: auto; }
  header {
    min-height: 180px; padding: 24px 16px; color: #fff; text-align: center;
    display: flex; flex-direction: column; justify-content: center;
    background: linear-gradient(rgb(0 0 0 / .12), rgb(0 0 0 / .12)),
                var(--pine) url(images/banner.jpg) center / cover no-repeat;
  }
  header h1 {
    margin: 0; font-size: clamp(1.7rem, 5vw, 2.8rem); font-weight: 700; line-height: 1.15;
    text-shadow: 0 2px 10px rgb(0 0 0 / .7);
  }
  header p { margin: 6px 0 0; font-size: 1.05rem; text-shadow: 0 1px 6px rgb(0 0 0 / .8); }
  main { padding: 20px 16px 48px; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px 12px; }
  @media (min-width: 640px)  { .grid { grid-template-columns: repeat(3, 1fr); } }
  @media (min-width: 900px)  { .grid { grid-template-columns: repeat(4, 1fr); gap: 20px 16px; } }
  @media (min-width: 1100px) { .grid { grid-template-columns: repeat(5, 1fr); } }
  .card { display: flex; flex-direction: column; }
  .media {
    position: relative; aspect-ratio: 1; border-radius: 12px; overflow: hidden;
    background: var(--pine);
  }
  .media img, .media video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .media video { opacity: 0; transition: opacity .2s; }
  .media.playing video { opacity: 1; }
  /* Small pill that plays the layer-stacking video (hover also plays it on desktop). */
  .media button {
    position: absolute; left: 8px; bottom: 8px; border: 0; cursor: pointer;
    font: 600 0.75rem/1 system-ui, sans-serif; color: #fff; padding: 6px 10px;
    border-radius: 999px; background: rgb(0 0 0 / .55); backdrop-filter: blur(4px);
  }
  .media button:hover { background: rgb(0 0 0 / .75); }
  .card .body { padding: 8px 2px 0; display: flex; flex-direction: column; gap: 4px; flex: 1; }
  .card h3 { margin: 0; font-size: 0.95rem; font-weight: 400; flex: 1; }
  .card .price { font-weight: 700; margin-bottom: 4px; }
  .btn {
    display: block; text-align: center; text-decoration: none; font-weight: 600;
    font-size: 0.9rem; padding: 9px; border-radius: 999px;
    background: var(--etsy); color: #fff;
  }
  .btn:hover { filter: brightness(1.12); }
  .card.free .price { color: var(--accent); }
  .card.free .btn { background: var(--accent); color: var(--accent-text); }
  footer { text-align: center; margin-top: 32px; }
  footer a { color: var(--text); font-weight: 600; }
</style>
</head>
<body>
<header>
  <h1 id="shop-name"></h1>
  <p id="tagline"></p>
</header>
<main>
  <div class="grid" id="products"></div>

  <footer><a id="shop-link" target="_blank" rel="noopener">See the whole shop on Etsy &rarr;</a></footer>
</main>

<script>
// All content comes from site.json. Edit that file to change the page.
fetch("site.json").then(r => r.json()).then(site => {
  const el = (tag, props = {}, kids = []) => {
    const e = Object.assign(document.createElement(tag), props);
    e.append(...kids);
    return e;
  };
  const media = p => {
    const box = el("div", { className: "media" }, [el("img", { src: p.image, alt: p.title, loading: "lazy" })]);
    if (!p.video) return box;
    const video = el("video", { muted: true, loop: true, playsInline: true, preload: "none" });
    const btn = el("button", { type: "button", textContent: "\u25B6 Layers",
                               title: "Watch the layers stack", ariaLabel: "Watch the layers stack" });
    box.append(video, btn);
    const play = () => {
      if (!video.src) video.src = p.video;
      video.currentTime = 0;
      video.play().catch(() => {});
      box.classList.add("playing");
      btn.textContent = "\u25A0 Photo";
    };
    const stop = () => {
      video.pause();
      box.classList.remove("playing");
      btn.textContent = "\u25B6 Layers";
    };
    btn.addEventListener("click", () => box.classList.contains("playing") ? stop() : play());
    if (matchMedia("(hover: hover)").matches) {
      box.addEventListener("mouseenter", play);
      box.addEventListener("mouseleave", stop);
    }
    return box;
  };
  const card = (p, button, cls = "card") => el("div", { className: cls }, [
    media(p),
    el("div", { className: "body" }, [
      el("h3", { textContent: p.title }),
      el("div", { className: "price", textContent: p.price }),
      button,
    ]),
  ]);

  document.title = site.free.title;
  document.getElementById("shop-name").textContent = site.shop_name;
  document.getElementById("tagline").textContent = site.tagline || "";
  document.getElementById("shop-link").href = site.etsy_shop_url;

  const grid = document.getElementById("products");
  const f = site.free;
  grid.append(card(f, el("a", { className: "btn", href: f.file, download: "",
                                textContent: "Free download" }), "card free"));
  for (const p of site.products) {
    grid.append(card(p, el("a", { className: "btn", href: p.etsy_url, target: "_blank",
                                  rel: "noopener", textContent: "Buy on Etsy" })));
  }
});
</script>
</body>
</html>
