<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Free Laser Cut File</title>
<meta name="description" content="Download the free laser cut file, and see more designs.">
<link rel="icon" href="images/logo.png">
<style>
  /* Colors sampled from the Etsy shop page. */
  :root {
    --bg: #faf8f5; --card: #fff; --text: #222; --muted: #595959;
    --pine: #14190c; --accent: #7a1418; --accent-text: #fff;
    --etsy: #f1641e; --line: #e6e1d9; --wood: #eadec8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  img { display: block; width: 100%; height: auto; }
  .banner {
    height: 120px; background: var(--pine) url(images/banner.jpg) center / cover no-repeat;
  }
  main { max-width: 960px; margin: 0 auto; padding: 0 16px 48px; }
  header {
    display: flex; align-items: center; gap: 14px;
    margin: -28px 0 28px; position: relative;
  }
  header img {
    width: 76px; height: 76px; border-radius: 10px; flex: none;
    border: 3px solid var(--bg); background: var(--wood);
  }
  header h1 { margin: 24px 0 0; font-size: 1.5rem; font-weight: 600; line-height: 1.2; overflow-wrap: anywhere; }
  @media (max-width: 480px) { header h1 { font-size: 1.15rem; } }
  header p { margin: 0; color: var(--muted); font-size: 0.95rem; }
  .btn {
    display: block; text-align: center; text-decoration: none; font-weight: 600;
    padding: 12px 16px; border-radius: 999px;
  }
  .btn:hover { filter: brightness(1.12); }
  .free {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    overflow: hidden; max-width: 480px; margin: 0 auto 40px;
  }
  .free .body { padding: 16px; }
  .free h2 { margin: 0 0 4px; font-size: 1.3rem; }
  .free p { margin: 0 0 16px; color: var(--muted); }
  .free .btn { background: var(--accent); color: var(--accent-text); font-size: 1.1rem; padding: 14px; }
  h2.section { font-size: 1.3rem; font-weight: 500; margin: 0 0 16px; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  @media (min-width: 640px) { .grid { grid-template-columns: repeat(3, 1fr); gap: 20px; } }
  .card { display: flex; flex-direction: column; }
  .card img { border-radius: 12px; }
  .card .body { padding: 8px 2px 0; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .card h3 { margin: 0; font-size: 0.95rem; font-weight: 400; flex: 1; }
  .card .btn { background: var(--etsy); color: #fff; font-size: 0.9rem; padding: 9px; }
  footer { text-align: center; margin-top: 32px; }
  footer a { color: var(--text); font-weight: 600; }
</style>
</head>
<body>
<div class="banner"></div>
<main>
  <header>
    <img src="images/logo.png" alt="">
    <div>
      <h1 id="shop-name"></h1>
      <p id="tagline"></p>
    </div>
  </header>

  <section class="free" id="free"></section>

  <h2 class="section">More designs</h2>
  <div class="grid" id="products"></div>

  <footer><a id="shop-link" target="_blank" rel="noopener">See the whole shop on Etsy &rarr;</a></footer>
</main>

<script>
// All content comes from site.json. Edit that file to change the page.
fetch("site.json").then(r => r.json()).then(site => {
  const el = (tag, props = {}, kids = []) => {
    const e = Object.assign(document.createElement(tag), props);
    e.append(...kids);
    return e;
  };

  document.title = site.free.title;
  document.getElementById("shop-name").textContent = site.shop_name;
  document.getElementById("tagline").textContent = site.tagline || "";
  document.getElementById("shop-link").href = site.etsy_shop_url;

  const f = site.free;
  document.getElementById("free").append(
    el("img", { src: f.image, alt: f.title }),
    el("div", { className: "body" }, [
      el("h2", { textContent: f.title }),
      el("p", { textContent: f.text }),
      el("a", { className: "btn", href: f.file, download: "", textContent: "Download free file" }),
    ]),
  );

  const grid = document.getElementById("products");
  for (const p of site.products) {
    grid.append(el("div", { className: "card" }, [
      el("img", { src: p.image, alt: p.title, loading: "lazy" }),
      el("div", { className: "body" }, [
        el("h3", { textContent: p.title }),
        el("a", { className: "btn", href: p.etsy_url, target: "_blank", rel: "noopener",
                  textContent: "Buy on Etsy" }),
      ]),
    ]));
  }
});
</script>
</body>
</html>
